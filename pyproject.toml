[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataevolver"
version = "0.1.0"
description = "Self-evolving data preparation for LLMs (open-source edition)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.109.0",
  "uvicorn[standard]>=0.27.0",
  "python-multipart>=0.0.6",
  "pydantic>=2.0.0",
  "typer>=0.12.0",
]

[project.scripts]
dataevolver = "cli.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "subsystems*", "web*", "cli*"]
